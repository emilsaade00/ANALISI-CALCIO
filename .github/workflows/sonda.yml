name: Sonda fonti (temporaneo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Controlla sostituzioni e calendario
        shell: python
        run: |
          import json, urllib.request
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (calcio-in-chiaro)"})
              return json.loads(urllib.request.urlopen(req, timeout=30).read())
          sb = get("https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard")
          lg = sb["leagues"][0]
          print("season", json.dumps(lg.get("season"))[:400])
          cal = lg.get("calendar") or []
          print("calendar type", type(cal).__name__, len(cal), json.dumps(cal[:3])[:600], json.dumps(cal[-2:])[:300])
          for q in ["dates=20260801-20261130", "dates=202611", "dates=20261101-20261110"]:
              try:
                  r = get("https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard?" + q)
                  print(q, "->", len(r.get("events", [])))
              except Exception as e:
                  print(q, "errore", e)
          s = get("https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/summary?event=401875003")
          print("header comp:", json.dumps(s["header"]["competitions"][0].get("date")), [ (c["team"]["displayName"], c["team"].get("id"), c.get("homeAway"), c.get("score")) for c in s["header"]["competitions"][0]["competitors"]])
          subs = [k for k in s.get("keyEvents", []) if "Substitution" in (k.get("type", {}).get("text") or "")]
          print("SUB", json.dumps(subs[0])[:1500])
          reds = [k for k in s.get("keyEvents", []) if "Red" in (k.get("type", {}).get("text") or "")]
          print("RED", json.dumps(reds[:1])[:800])
          for r in s["rosters"]:
              print("team", r["team"]["displayName"], r["team"].get("id"), r.get("homeAway"))
              for p in r["roster"]:
                  if p.get("subbedOut") or p.get("subbedIn"):
                      q = {k: v for k, v in p.items() if k != "stats"}
                      print("ROSTER", json.dumps(q)[:1500]); break
              p = r["roster"][0]
              print("ATHLETE", json.dumps(p.get("athlete"))[:600])
              print("keys", list(p.keys()))
              break
